<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="../estilos/style-home.css">
</head>

<body>
    <header id="header"></header>

    <div id="home-content">
        <h3>HOME/DROPS</h3>
        <div>
            <span id="mensaje-alerta">This is a simple home page.</span>
        </div>

        <div class="contenedor">
            <div>
                <section class="shop-section">
                    <div class="filtros">
                        <span>Filtros</span>
                        <ul>
                            <li><a href="#">Todos</a></li>
                            <li><a href="#">Pistolas</a></li>
                            <li><a href="#">Subfusil</a></li>
                            <li><a href="#">Rifles</a></li>
                            <li><a href="#">Escopetas</a></li>
                            <li><a href="#">Cuerpo a cuerpo</a></li>
                            <li><a href="#">Municion</a></li>
                        </ul>
                    </div>
                </section>
            </div>

            <div class="caluga">
                <article class="product-card">
                    <span>NUEVO</span>
                    <div class="product-image">
                        <a href="../Product/product.html?id=1">
                            <img src="../assets-img/static_wikia_nocookie_net-latest.webp" alt="Desert Eagle">
                        </a>
                        <button class="favorite-btn" aria-label="Agregar a favoritos">♡</button>
                    </div>

                    <div class="product-content">
                        <span class="product-category">Pistola</span>
                        <h3 class="name-product">Desert Eagle</h3>

                        <div class="weapon-stats">
                            <div class="stat">
                                <span>Daño</span>
                                <div class="stat-bar">
                                    <div class="stat-value" style="width: 85%;"></div>
                                </div>
                            </div>

                            <div class="stat">
                                <span>Precisión</span>
                                <div class="stat-bar">
                                    <div class="stat-value" style="width: 70%;"></div>
                                </div>
                            </div>

                            <div class="stat">
                                <span>Alcance</span>
                                <div class="stat-bar">
                                    <div class="stat-value" style="width: 65%;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="product-footer">
                            <div>
                                <span class="product-price">$12.500</span>
                                <span class="respect-points">+150 RP</span>
                            </div>

                            <button onclick="agregaritemAlCarrito(this)" class="btn-agregar-item"> agregar </button>
                        </div>
                    </div>
                </article>
            </div>

            <div>
                otra catalogo
            </div>
        </div>
    </div>

    <footer id="footer"></footer>

    <script src="../scripts/scripts.js"></script>
    <script src="../scripts/scripts-home.js"></script>
</body>

</html>
