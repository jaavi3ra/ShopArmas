
            <section id="producto-detalle">

                <article id="producto-imagen">
                    <img id="imagen-principal" src="" alt="Producto">
                </article>

                <article id="producto-informacion">

                    <span class="product-category" id="categoria-producto">
                        Pistola
                    </span>

                    <h1 class="name-product" id="nombre-producto"> 
                        Nombre del producto
                    </h1>

                    <p id="descripcion-producto">
                        Descripción del producto
                    </p>
                    <div class="weapon-stats">
                        <div class="stat">
                            <span>Daño</span>

                            <div class="stat bar">
                                <div class="stat-value" style="width: 85%;"></div>
                            </div>
                        </div>

                        <div class="stat">
                            <span>Precisión</span>

                            <div class="stat-bar">
                                <div class="stat-value" style="width: 70%;"></div>
                            </div>
                        </div>

                        <div class="stat">
                            <span>Alcance</span>

                            <div class="stat-bar">
                                <div class="stat-value" style="width: 65%;"></div>
                            </div>
                        </div>

                    </div>

                    <div id="cantidad-producto">
                        <label for="cantidad">
                            Cantidad:
                        </label>
                        <input type="number" id="cantidad" min="1" value="1">
                    </div>

                    <div class="product-footer">

                        <span class="product-price" id="precio-producto">
                            $12.500
                        </span>

                        <button onclick ="agregarCarrito()" class="btn-agregar-item">
                        Agregar al carrito
                        </button>

                    </div>
                    
                </article>

                <section id="productos-relacionados">
                    <h2>
                        Productos relacionados
                    </h2>
                    <div id="lista-relacionados">
                        
                    </div>
            </section>
