<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>

    <link rel="stylesheet" href="../estilos/style.css">
    <link rel="stylesheet" href="./product.css">
</head>

<body>
    <header id="header"></header>

    <main class="detalle-producto">
        <!-- Ruta de navegacion del producto actual. -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a href="../index.html">Home</a> &gt;
            <a href="../index.html#Catalogo">Catalogo</a> &gt;
            <span id="breadcrumbProducto"></span>
        </nav>

        <!-- Imagen principal y miniaturas del producto. -->
        <section class="producto">
            <div class="producto-imagenes">
                <div class="slider-imagen">
                    <button class="flecha flecha-izquierda" onclick="anterior()" aria-label="Imagen anterior"></button>

                    <img id="imagenProducto" alt="producto">

                    <button class="flecha flecha-derecha" onclick="siguiente()" aria-label="Imagen siguiente"></button>
                </div>

                <div class="miniaturas">
                    <img src="../assets-img/Pistola.jpg" alt="Pistola principal" onclick="mostrarImagenPorIndice(0)">
                    <img src="../assets-img/pistola2.jpg" alt="Pistola secundaria" onclick="mostrarImagenPorIndice(1)">
                </div>
            </div>

            <!-- Informacion y acciones del producto seleccionado. -->
            <div class="producto-info">
                <div class="producto-titulo">
                    <h1 id="nombreProducto"></h1>
                    <div class="producto-precio">
                        <h2 id="precioProducto"></h2>
                        <span id="rpProducto"></span>
                    </div>
                </div>

                <p id="descripcionProducto"></p>

                <!-- Estadisticas del producto seleccionado. -->
                <div class="weapon-stats" id="estadisticasProducto"></div>

                <label for="cantidadProducto">Cantidad</label>
                <select id="cantidadProducto">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <button>Agregar al carrito</button>
                <button>Comprar ahora</button>
            </div>
        </section>

        <section class="productos-relacionados">
            <h3>Productos relacionados</h3>

            <div class="relacionados-lista" id="productosRelacionados"></div>
        </section>
    </main>

    <footer id="footer"></footer>

    <script src="../scripts/scripts.js"></script>
    <script src="./product.js"></script>
</body>

</html>
